<style>
:root{color-scheme:dark;--bg:#050505;--bgr:5,5,5;--fg:#fff;--red:#F20D20;--mut:#9a9a9f;--line:#222226;--card:#0d0d0f;--p:#cfcfd4;--hov:#44444a;--err:#ff6b77;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{color-scheme:light;--bg:#f6f6f8;--bgr:246,246,248;--fg:#0b0b0d;--mut:#5c5c64;--line:#d9d9de;--card:#fff;--p:#2c2c32;--hov:#9a9aa3;--err:#c4202f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(var(--bgr),.9);z-index:30}
h1,h2,h3{font-family:"Eurostile","Bank Gothic","Segoe UI",Roboto,sans-serif;letter-spacing:.02em;line-height:1.15;margin:0 0 .5em}
h1{font-size:clamp(2rem,8vw,4rem);font-weight:800}h2{font-size:clamp(1.5rem,5vw,2.4rem)}h3{font-size:1.1rem}
p{margin:0 0 1em;color:var(--p)}a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
main:focus,main:focus-visible{outline:none}
.skip{position:absolute;left:-999px;top:8px;background:var(--red);color:#fff;padding:8px 14px;border-radius:6px;z-index:50}.skip:focus{left:8px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(var(--bgr),.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;letter-spacing:.18em;margin-right:auto}
.brand img{width:40px;height:40px;object-fit:contain;background:#050505;border-radius:10px;padding:2px}
nav{display:flex;gap:2px}
nav a{color:var(--mut);text-decoration:none;padding:8px 8px;font-size:.84rem;border-radius:6px;transition:.2s;white-space:nowrap}
nav a:hover,nav a[aria-current=page]{color:var(--fg)}
nav a[aria-current=page]{box-shadow:inset 0 -2px var(--red)}
.btn{display:inline-block;border:1px solid var(--line);background:transparent;color:var(--fg);padding:12px 22px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;transition:.2s}
.btn:hover{border-color:var(--fg)}.btn:active{transform:scale(.98)}
.btn.p{background:var(--red);border-color:var(--red);color:var(--on,#fff)}.btn.p:hover{filter:brightness(1.12)}
.sm{padding:6px 12px;font-size:.85rem}
.ic{min-width:36px;padding:6px 8px;line-height:1.2}
#acc{display:inline-flex;align-items:center;justify-content:center}#acc i{width:14px;height:14px;border-radius:50%;background:var(--red);display:block}
#burger{display:none;padding:8px 12px}
@media(max-width:1180px){#burger{display:block}
nav{display:none;position:absolute;left:0;right:0;top:64px;flex-direction:column;background:var(--bg);padding:10px 20px 20px;border-bottom:1px solid var(--line)}
nav.open{display:flex}nav a{padding:14px 4px;font-size:1rem;border-bottom:1px solid var(--line)}}
.noscript{padding:24px;text-align:center;color:var(--p)}
.view{display:none;animation:in .4s ease}.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
section{padding:56px 0;border-top:1px solid var(--line)}section:first-child{border-top:0}
.hero{padding:64px 0 48px;display:grid;gap:32px;align-items:center}
@media(min-width:860px){.hero{grid-template-columns:1.3fr 1fr}}
.tag{color:var(--red);font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
.stage{position:relative;width:100%;max-width:400px;aspect-ratio:1;justify-self:center;background:#050505;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.stage img,.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:.78rem;color:var(--mut);text-decoration:none;margin:0 0 16px}
.badge:hover{border-color:var(--red);color:var(--fg)}.badge b{width:8px;height:8px;border-radius:50%;background:var(--red);display:block;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;transition:.25s;position:relative}
.card:hover{border-color:var(--hov);transform:translateY(-2px)}
.card .n{color:var(--red);font-size:.8rem;letter-spacing:.15em}
.cover{height:120px;border-radius:8px;margin-bottom:14px;position:relative;overflow:hidden;border:1px solid var(--line);background-size:cover;background-position:center}
.cover::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:40%;background:var(--red)}
.pill{display:inline-block;font-size:.72rem;border:1px solid var(--line);padding:2px 10px;border-radius:99px;color:var(--mut);margin:0 6px 8px 0}
.demo{border-color:var(--red);color:var(--red)}.real{background:var(--red);border-color:var(--red);color:var(--on,#fff)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip{background:none;border:1px solid var(--line);color:var(--mut);padding:8px 14px;border-radius:99px;font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.note{border-left:2px solid var(--red);padding:8px 14px;color:var(--mut);font-size:.9rem;margin:0 0 24px}
form{display:grid;gap:16px;max-width:560px}
label{display:grid;gap:6px;font-size:.9rem}
input,textarea,select{background:var(--card);border:1px solid var(--line);color:var(--fg);padding:12px;border-radius:8px;font:inherit;width:100%}
input[aria-invalid=true],textarea[aria-invalid=true]{border-color:var(--red)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.err{color:var(--err);font-size:.8rem;min-height:1.2em}
#fs{padding:12px;border:1px solid var(--line);border-radius:8px;display:none}#fs.show{display:block}
footer{border-top:1px solid var(--line);padding:32px 0;color:var(--mut);font-size:.85rem}
footer a{color:var(--mut)}footer a:hover{color:var(--fg)}
.flinks{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;align-items:center}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--hov);border-radius:14px;max-width:520px;width:calc(100% - 32px);padding:22px}
dialog::backdrop{background:rgba(0,0,0,.75)}
.road{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.road li{border:1px dashed var(--line);padding:14px;border-radius:10px;color:var(--p)}
/* timeline (roadmap + devlog) */
.tl{list-style:none;margin:0;padding:0 0 0 22px;border-left:2px solid var(--line);display:grid;gap:22px}
.tl>li{position:relative}.tl>li::before{content:"";position:absolute;left:-29px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--mut)}
.tl>li[data-s=done]::before{background:var(--red);border-color:var(--red)}
.tl>li[data-s=doing]::before{border-color:var(--red);animation:pulse 2s infinite}
.tl h3{margin:0 0 4px;font-size:1rem}.tl p{margin:0;font-size:.92rem}.tl time{color:var(--mut);font-size:.78rem;letter-spacing:.08em}
.tl ul{margin:6px 0 0;padding-left:18px;color:var(--p);font-size:.92rem}
/* lab */
.lab{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-bottom:28px}
.lab .card h3{margin-bottom:6px}.lab canvas{width:100%;display:block;background:#050505;border-radius:8px;border:1px solid var(--line)}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.pal button{height:64px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font:inherit;font-size:.68rem;color:#fff;text-shadow:0 1px 2px #000;padding:0}
.bars{display:grid;gap:6px;margin:10px 0;font-size:.85rem}
.bar2{display:grid;grid-template-columns:80px 1fr 44px;gap:8px;align-items:center}
.bar2 i{display:block;height:10px;background:var(--red);border-radius:5px;min-width:2px;transition:width .3s}
.gen{min-height:3.2em;padding:10px;border:1px dashed var(--line);border-radius:8px;color:var(--p);font-size:.92rem}
/* terminal */
#term{padding:0;max-width:640px;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#050505;color:#e8e8ea;border-color:#44444a}
#tout{height:300px;overflow:auto;padding:14px;white-space:pre-wrap;word-break:break-word}
#tout .o{color:#9a9a9f}#tout .r{color:var(--red)}
.tin{display:flex;align-items:center;gap:8px;border-top:1px solid #222226;padding:10px 14px}
.tin .btn{color:#fff;border-color:#44444a}.tin span{color:var(--red)}.tin input{flex:1;background:none;border:0;color:#fff;font:inherit;padding:0;outline:none;width:auto}
/* FAQ */
.faq{max-width:760px;display:grid;gap:10px;margin-top:20px}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 18px}
.faq summary{cursor:pointer;padding:16px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--red);font-size:1.3rem;line-height:1}
.faq details[open] summary::after{content:"\2212"}
.faq details p{margin:0 0 16px}
/* 404 */
.lost{width:100%;max-width:360px;display:block;margin:0 0 20px}
.lost .dot{offset-path:path("M180 90 C 230 20,330 40,330 90 S 230 160,180 90 S 30 20,30 90 S 130 160,180 90");animation:orb 6s linear infinite;offset-rotate:0deg}
.lost .gone{animation:gone 6s ease-in-out infinite}
@keyframes orb{to{offset-distance:100%}}
@keyframes gone{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,-50px)}}
.legal{max-width:720px}
@media print{header,footer,.btn{display:none}}

/* accent picker */
[hidden]{display:none!important}
dialog.sheet{padding:0;max-width:480px}
.sin{padding:22px}.sin h2{font-size:1.25rem;margin:0 0 4px}.sin .sub{margin:0 0 18px;color:var(--mut);font-size:.95rem}
.sws{display:flex;flex-wrap:nowrap;gap:clamp(6px,2.2vw,12px);padding:5px 5px 6px}
.sw{flex:0 1 40px;min-width:0;aspect-ratio:1;height:auto;border-radius:50%;border:1px solid rgba(128,128,128,.35);cursor:pointer;padding:0;transition:transform .15s}
.sw:hover{transform:scale(1.08)}
.sw.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--fg)}
.sw.plus{background:var(--card);color:var(--fg);font:600 clamp(14px,5.5vw,24px)/1 "Segoe UI",Roboto,sans-serif;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
.pk-top{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.pk-top .dot{width:48px;height:48px;border-radius:50%;border:3px solid var(--line);flex:none}
#pkhex{font:600 1.1rem ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase}
#pksv{position:relative;height:200px;border-radius:12px;touch-action:none;cursor:crosshair;margin-bottom:18px;border:1px solid var(--line)}
#pksvk{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.45);pointer-events:none}
#pkhue{-webkit-appearance:none;appearance:none;height:14px;padding:0;border:0;border-radius:99px;margin:0 0 22px;--hc:#f00;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#pkhue::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--hc);border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.45)}
#pkhue::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--hc);border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.pk-act{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){dialog.sheet{margin:auto auto 0;width:100%;max-width:none;border-radius:20px 20px 0 0}}

</style>

{id:"axiom",cat:"ai",st:"development",avail:1,hue:350,logo:LOGO.axiom,n:"AXIOM",url:"https://juanpnv.github.io/AXIOM/AXIOM.html",
 pt:"Inteligência artificial da AUREVANT: conversa, estudos, ideias e ferramentas num só app, com sequência diária e conversas organizadas.",
 en:"AUREVANT’s artificial intelligence: chat, study, ideas and tools in one app, with daily streaks and organized conversations.",
 long:{pt:"O AXIOM é a inteligência artificial da AUREVANT, com o lema “Sua inteligência. Sem limites.”. Na tela inicial você pergunta qualquer coisa por texto, anexo ou voz e acessa atalhos para Assistente, Estudos, Ideias e Ferramentas. O app acompanha sua sequência diária com metas de foco, mensagens e ideias, sugere uma ideia do dia e organiza suas conversas, que podem ser buscadas, fixadas, renomeadas e exportadas. O perfil reúne estatísticas de uso, favoritos, arquivos enviados, memória e instruções, e assinaturas. Está na versão 1.0.0. Ainda em desenvolvimento, já pode ser usado por qualquer pessoa, com ou sem conta.",
       en:"AXIOM is AUREVANT’s artificial intelligence, with the tagline “Sua inteligência. Sem limites.” (“Your intelligence. No limits.”). On the home screen you ask anything by text, attachment or voice and reach shortcuts to Assistant, Studies, Ideas and Tools. The app tracks your daily streak with focus, message and idea goals, suggests an idea of the day and organizes your conversations, which can be searched, pinned, renamed and exported. The profile gathers usage stats, favorites, uploaded files, memory and instructions, and subscriptions. It is at version 1.0.0. Still in development, it can already be used by anyone, with or without an account."},

{id:"estudaplus",cat:"apps",st:"development",avail:1,hue:350,logo:LOGO.estudaplus,n:"ESTUDA+",url:"https://juanpnv.github.io/ESTUDA-MAIS/ESTUDA+.html",
 pt:"Aplicativo de estudos do 1º ao 9º ano, Ensino Médio, faculdade, cursos, olimpíadas e vestibulares, com meta diária, XP, níveis, sequência de dias e conquistas.",
 en:"Study app for grades 1–9, high school, college, courses, olympiads and entrance exams, with a daily goal, XP, levels, streaks and achievements.",
 long:{pt:"O ESTUDA+ é o aplicativo de estudos da AUREVANT, com o lema “Disciplina, foco, resultados”. Na tela inicial você define uma meta diária de estudo, acompanha a semana e começa a estudar. Em Séries ficam o Ensino Fundamental (1º ao 9º ano), o Ensino Médio (1º ao 3º ano) e a Faculdade, com 48 cursos no catálogo, tudo organizado por matérias e com o progresso de cada série. Em Provas você encontra 106 olimpíadas em 11 áreas e 70 vestibulares em 6 categorias, e pode importar provas anteriores que tenha permissão de usar. O estudo vira progresso com XP, níveis, sequência de dias e 100 conquistas. No perfil há metas, exportar e importar progresso, tema escuro, cor do app e um assistente de IA que se conecta pelo link do seu servidor. Foi feito para o celular. Ainda em desenvolvimento, já pode ser usado por qualquer pessoa.",
       en:"ESTUDA+ is AUREVANT’s study app, with the tagline “Disciplina, foco, resultados” (“Discipline, focus, results”). On the home screen you set a daily study goal, follow your week and start studying. Series holds elementary and middle school (grades 1 to 9), high school (grades 1 to 3) and College, with 48 courses in the catalog, all organized by subject with progress for each grade. In Exams you find 106 olympiads across 11 areas and 70 entrance exams in 6 categories, and can import past exams you are allowed to use. Studying turns into progress with XP, levels, daily streaks and 100 achievements. The profile has goals, progress export and import, dark theme, app color and an AI assistant that connects through your own server link. It is built for mobile. Still in development, it can already be used by anyone."},

function h2hsv(hex){const n=parseInt(hex.slice(1),16),r=(n>>16)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return{h,s:mx?d/mx:0,v:mx}}
function hsv2h(o){const f=n=>{const k=(n+o.h/60)%6;return o.v-o.v*o.s*Math.max(0,Math.min(k,4-k,1))};return"#"+[f(5),f(3),f(1)].map(x=>Math.round(x*255).toString(16).padStart(2,"0")).join("")}
const adlg=$("#accdlg"),PK={h:0,s:1,v:1};
function accPanel(p){$("#accmain").hidden=p!=="main";$("#accpick").hidden=p!=="pick"}
function swRender(){const box=$("#sws");box.setAttribute("aria-label",t("acc_h"));
box.replaceChildren(...ACCENTS.map(([k,hex])=>{const b=E("button",null,"sw");b.type="button";b.style.background=hex;b.dataset.hex=hex;b.title=t("accn")[k];b.setAttribute("aria-label",t("accn")[k]);b.onclick=()=>setAccent(hex);return b}));
const p=E("button","+","sw plus");p.type="button";p.id="swplus";p.title=t("pk_more");p.setAttribute("aria-label",t("pk_more"));p.onclick=openPicker;box.append(p);accSync()}
function accSync(){const cur=ACCENT.toLowerCase();let found=null;
$$("#sws .sw:not(.plus)").forEach(b=>{const on=b.dataset.hex.toLowerCase()===cur;if(on)found=b.title;b.setAttribute("aria-pressed",on);b.classList.toggle("on",on)});
const pl=$("#swplus");if(pl){const c=!found;pl.classList.toggle("on",c);pl.setAttribute("aria-pressed",c);pl.style.background=c?ACCENT:"";pl.style.color=c?onColor(ACCENT):""}
const s=$("#accsub");if(s)s.textContent=(found||t("acc_custom"))+" · "+t("acc_tap")}
function pkRender(from){const hex=hsv2h(PK),pv=$("#pkprev");pv.style.background=hex;
if(from!=="hex"){$("#pkhex").value=hex.toUpperCase();$("#pkhex").removeAttribute("aria-invalid")}
if(from!=="hue")$("#pkhue").value=Math.round(PK.h);
$("#pkhue").style.setProperty("--hc","hsl("+PK.h+" 100% 50%)");
$("#pksv").style.background="linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,hsl("+PK.h+" 100% 50%))";
const k=$("#pksvk");k.style.left=PK.s*100+"%";k.style.top=(1-PK.v)*100+"%";k.style.background=hex;
const ok=$("#pkok");ok.style.background=hex;ok.style.borderColor=hex;ok.style.color=onColor(hex);ok.style.boxShadow="0 6px 22px "+hex+"55"}
function openPicker(){Object.assign(PK,h2hsv(ACCENT));accPanel("pick");pkRender();$("#pksv").focus()}
$("#acc").onclick=()=>{accPanel("main");accSync();adlg.showModal()};
adlg.addEventListener("click",e=>{if(e.target===adlg)adlg.close()});
$("#pkcancel").onclick=()=>{accPanel("main");$("#swplus").focus()};
$("#pkok").onclick=()=>{setAccent(hsv2h(PK));adlg.close()};
{const sv=$("#pksv");
const set=e=>{const r=sv.getBoundingClientRect();PK.s=clamp((e.clientX-r.left)/r.width);PK.v=1-clamp((e.clientY-r.top)/r.height);pkRender()};
sv.addEventListener("pointerdown",e=>{sv.setPointerCapture(e.pointerId);set(e);sv.focus()});
sv.addEventListener("pointermove",e=>{if(sv.hasPointerCapture(e.pointerId))set(e)});
sv.addEventListener("keydown",e=>{const st=e.shiftKey?.1:.02;let h=1;
if(e.key==="ArrowLeft")PK.s-=st;else if(e.key==="ArrowRight")PK.s+=st;else if(e.key==="ArrowUp")PK.v+=st;else if(e.key==="ArrowDown")PK.v-=st;else h=0;
if(h){e.preventDefault();e.stopPropagation();PK.s=clamp(PK.s);PK.v=clamp(PK.v);pkRender()}})}
$("#pkhue").addEventListener("input",e=>{PK.h=+e.target.value;pkRender("hue")});
$("#pkhex").addEventListener("input",e=>{let v=e.target.value.trim();if(v[0]!=="#")v="#"+v;
if(isHex(v)){const o=h2hsv(v);if(o.s===0||o.v===0)o.h=PK.h;Object.assign(PK,o);pkRender("hex");e.target.removeAttribute("aria-invalid")}else e.target.setAttribute("aria-invalid","true")});
$("#pkhex").addEventListener("blur",()=>pkRender());
$("#pkhex").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("#pkok").click()}});
$("#burger").onclick=()=>{const o=$("#nav").classList.toggle("open");$("#burger").setAttribute("aria-expanded",o)};
$("#dclose").onclick=()=>$("#dlg").close();
addEventListener("hashchange",()=>route());
addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#nav").classList.contains("open")){$("#nav").classList.remove("open");$("#burger").setAttribute("aria-expanded","false");$("#burger").focus()}});
$("#dlg").addEventListener("click",e=>{if(e.target===$("#dlg"))$("#dlg").close()});
// ===== TERMINAL =====
const term=$("#term"),tout=$("#tout"),tin=$("#tin"),hist=[];let hi=0;
function tp(s,c){const d=E("div",s,c);tout.append(d);tout.scrollTop=tout.scrollHeight}
function openTerm(){if(term.open)return;term.showModal();if(!tout.childNodes.length)tp(t("tm_hi"),"o");tin.focus()}
function runCmd(raw){const[c,...a]=raw.trim().split(/\s+/),arg=a.join(" ");tp("› "+raw,"r");if(!c)return;
switch(c.toLowerCase()){
case"help":tp(t("tm_help"),"o");break;
case"about":tp(t("about_p"),"o");break;
case"projects":PROJECTS.forEach(p=>tp(p.n+" ["+t("st")[p.st]+"]"+(p.url?" "+p.url:""),"o"));break;
case"goto":case"open":if(PAGES.includes(arg)){location.hash=arg;tp(t("tm_ok"),"o")}else tp(t("tm_pages")+PAGES.join(", "),"o");break;
case"lang":if(L[arg]){lang=arg;ls.set("av-lang",lang);render();tp(t("tm_ok"),"o")}else tp(t("tm_bad"),"o");break;
case"theme":if(arg==="dark"||arg==="light"){setTheme(arg);tp(t("tm_ok"),"o")}else tp(t("tm_bad"),"o");break;
case"accent":{const al={amber:"yellow",violet:"purple",grey:"gray"},nm=al[arg.toLowerCase()]||arg.toLowerCase(),f=ACCENTS.find(x=>x[0]===nm);if(setAccent(f?f[1]:arg))tp(t("tm_ok"),"o");else tp(t("tm_bad"),"o");break}
case"version":tp("AUREVANT v"+VERSION,"o");break;
case"whoami":tp(t("tm_who"),"o");break;
case"sudo":tp(t("tm_sudo"),"o");break;
case"clear":tout.replaceChildren();break;
case"exit":case"quit":term.close();break;
default:tp(t("tm_nf")+c,"o")}}
tin.addEventListener("keydown",e=>{if(e.key==="Enter"){const v=tin.value;if(v.trim()){hist.push(v);hi=hist.length}tin.value="";runCmd(v)}else if(e.key==="ArrowUp"){if(hi>0)tin.value=hist[--hi]||"";e.preventDefault()}else if(e.key==="ArrowDown"){hi=Math.min(hist.length,hi+1);tin.value=hist[hi]||"";e.preventDefault()}});
$("#termbtn").onclick=openTerm;$("#tclose").onclick=()=>term.close();
term.addEventListener("click",e=>{if(e.target===term)term.close()});
{const KON=["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"];let ki=0,buf="";
addEventListener("keydown",e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
ki=e.key===KON[ki]?ki+1:(e.key===KON[0]?1:0);if(ki===KON.length){ki=0;openTerm()}
if(e.key.length===1){buf=(buf+e.key.toLowerCase()).slice(-8);if(buf==="aurevant"){buf="";openTerm()}}})}
// ===== CONTACT =====
$("#cf").addEventListener("submit",async e=>{e.preventDefault();
const v=[1,2,3,4].map(i=>$("#f"+i).value.trim());let bad=0;
v.forEach((x,i)=>{let m="";if(!x)m=t("e_req");else if(i===1&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x))m=t("e_mail");else if(i===3&&x.length<10)m=t("e_min");
$("#e"+(i+1)).textContent=m;const fld=$("#f"+(i+1));fld.setAttribute("aria-invalid",!!m);fld.setAttribute("aria-describedby","e"+(i+1));if(m){if(!bad)fld.focus();bad++}});
const s=$("#fs");
if(bad){s.className="";return}
s.className="show";
if($("#f5").value){s.textContent=t("s_sent");return}
if(CONFIG.endpoint){s.textContent=t("s_sending");try{const fd=new FormData();fd.append("name",v[0]);fd.append("email",v[1]);fd.append("subject",v[2]);fd.append("message",v[3]);
const r=await fetch(CONFIG.endpoint,{method:"POST",body:fd,headers:{Accept:"application/json"}});if(r.ok){s.textContent=t("s_sent");$("#cf").reset()}else s.textContent=t("s_fail")}catch(err){s.textContent=t("s_fail")}return}
if(CONFIG.email){s.textContent=t("s_mail");location.href="mailto:"+CONFIG.email+"?subject="+encodeURIComponent(v[2])+"&body="+encodeURIComponent(v[3]+"\n\n"+v[0]+" <"+v[1]+">")}
else s.textContent=t("s_ok")});
// ===== BOOT =====
render();setTheme(document.documentElement.dataset.theme);
if(CONFIG.analytics.src&&navigator.doNotTrack!=="1"){const s=document.createElement("script");s.defer=true;s.src=CONFIG.analytics.src;if(CONFIG.analytics.domain)s.dataset.domain=CONFIG.analytics.domain;document.head.append(s)}
</script>
