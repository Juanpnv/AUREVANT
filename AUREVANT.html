<style>
:root{color-scheme:dark;--bg:#050505;--fg:#fff;--red:#F20D20;--mut:#9a9a9f;--line:#222226;--card:#0d0d0f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(5,5,5,.9);z-index:30}
h1,h2,h3{font-family:"Eurostile","Bank Gothic","Segoe UI",Roboto,sans-serif;letter-spacing:.02em;line-height:1.15;margin:0 0 .5em}
h1{font-size:clamp(2rem,8vw,4rem);font-weight:800}h2{font-size:clamp(1.5rem,5vw,2.4rem)}h3{font-size:1.1rem}
p{margin:0 0 1em;color:#cfcfd4}a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(5,5,5,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;letter-spacing:.18em;margin-right:auto}
.brand img{width:40px;height:40px;object-fit:contain}
nav{display:flex;gap:4px}
nav a{color:var(--mut);text-decoration:none;padding:8px 10px;font-size:.88rem;border-radius:6px;transition:.2s}
nav a:hover,nav a[aria-current=page]{color:#fff}
nav a[aria-current=page]{box-shadow:inset 0 -2px var(--red)}
.btn{display:inline-block;border:1px solid var(--line);background:transparent;color:#fff;padding:12px 22px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;transition:.2s}
.btn:hover{border-color:#fff}.btn:active{transform:scale(.98)}
.btn.p{background:var(--red);border-color:var(--red)}.btn.p:hover{background:#ff2a3b}
.sm{padding:6px 12px;font-size:.85rem}
#burger{display:none;padding:8px 12px}
@media(max-width:1020px){#burger{display:block}
nav{display:none;position:absolute;left:0;right:0;top:64px;flex-direction:column;background:#050505;padding:10px 20px 20px;border-bottom:1px solid var(--line)}
nav.open{display:flex}nav a{padding:14px 4px;font-size:1rem;border-bottom:1px solid var(--line)}}
.noscript{padding:24px;text-align:center;color:#cfcfd4}
.view{display:none;animation:in .4s ease}.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
section{padding:56px 0;border-top:1px solid var(--line)}section:first-child{border-top:0}
.hero{padding:64px 0 48px;display:grid;gap:32px;align-items:center}
@media(min-width:860px){.hero{grid-template-columns:1.3fr 1fr}}
.tag{color:var(--red);font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
.hero img{width:100%;height:auto;max-width:400px;justify-self:center}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;transition:.25s;position:relative}
.card:hover{border-color:#44444a;transform:translateY(-2px)}
.card .n{color:var(--red);font-size:.8rem;letter-spacing:.15em}
.cover{height:120px;border-radius:8px;margin-bottom:14px;position:relative;overflow:hidden;border:1px solid var(--line)}
.cover::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:40%;background:var(--red)}
.pill{display:inline-block;font-size:.72rem;border:1px solid var(--line);padding:2px 10px;border-radius:99px;color:var(--mut);margin:0 6px 8px 0}
.demo{border-color:var(--red);color:var(--red)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip{background:none;border:1px solid var(--line);color:var(--mut);padding:8px 14px;border-radius:99px;font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed=true]{background:#fff;color:#000;border-color:#fff}
.note{border-left:2px solid var(--red);padding:8px 14px;color:var(--mut);font-size:.9rem;margin:0 0 24px}
form{display:grid;gap:16px;max-width:560px}
label{display:grid;gap:6px;font-size:.9rem}
input,textarea{background:#0d0d0f;border:1px solid var(--line);color:#fff;padding:12px;border-radius:8px;font:inherit;width:100%}
input[aria-invalid=true],textarea[aria-invalid=true]{border-color:var(--red)}
.err{color:#ff6b77;font-size:.8rem;min-height:1.2em}
#fs{padding:12px;border:1px solid var(--line);border-radius:8px;display:none}#fs.show{display:block}
footer{border-top:1px solid var(--line);padding:32px 0;color:var(--mut);font-size:.85rem}
dialog{background:#0d0d0f;color:#fff;border:1px solid #44444a;border-radius:14px;max-width:520px;width:calc(100% - 32px);padding:22px}
dialog::backdrop{background:rgba(0,0,0,.75)}
.road{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.road li{border:1px dashed var(--line);padding:14px;border-radius:10px;color:#cfcfd4}
</style>
</head>

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const PAGES=["home","about","tech","projects","game","lab","platform","contact"];

if(!L[lang])lang="pt";
let fc="all",fs="all";
const t=k=>L[lang][k];
const E=(tag,txt,cls)=>{const e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e};
function pcard(p){const c=E("article",null,"card");const cv=E("div",null,"cover");cv.style.background=`linear-gradient(135deg,hsl(${p.hue} 40% 14%),#050505)`;c.append(cv);
c.append(E("span",t("cat")[p.cat],"pill"),E("span",t("st")[p.st],"pill"),E("span",t("demo"),"pill demo"),E("h3",p.n),E("p",p[lang]));
const b=E("button",t("details"),"btn sm");b.onclick=()=>detail(p);c.append(b);return c}
function detail(p){const d=$("#dbody");d.replaceChildren(E("h2",p.n),E("span",t("cat")[p.cat],"pill"),E("span",t("st")[p.st],"pill"),E("span",t("demo"),"pill demo"),E("p",p[lang]));$("#dclose").textContent=t("close");$("#dlg").showModal()}
function areaCards(el){el.replaceChildren(...t("areas").map((a,i)=>{const c=E("div",null,"card");c.append(E("div","0"+(i+1),"n"),E("h3",a[0]));c.append(E("p",a[1]));return c}))}
function chips(el,items,cur,set){el.replaceChildren(...items.map(([k,l])=>{const b=E("button",l,"chip");b.setAttribute("aria-pressed",k===cur);b.onclick=()=>{set(k);render();const again=[...el.children].find(x=>x.textContent===l);if(again)again.focus()};return b}))}
function render(){
document.documentElement.lang=lang==="pt"?"pt-BR":"en";$("#lang").textContent=lang==="pt"?"EN":"PT";
$$("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
$("#nav").replaceChildren(...PAGES.map(k=>{const a=E("a",t("nav_"+k));a.href="#"+k;a.dataset.p=k;return a}));
areaCards($("#areasHome"));areaCards($("#areasTech"));
$("#featured").replaceChildren(...PROJECTS.slice(0,3).map(pcard));
$("#princ").replaceChildren(...t("pr").map(x=>{const c=E("div",null,"card");c.append(E("h3",x[0]),E("p",x[1]));return c}));
chips($("#fc"),[["all",t("all")],...Object.entries(t("cat"))],fc,v=>fc=v);
chips($("#fs2"),[["all",t("all")],...Object.entries(t("st"))],fs,v=>fs=v);
const f=PROJECTS.filter(p=>(fc==="all"||p.cat===fc)&&(fs==="all"||p.st===fs));
$("#plist").replaceChildren(...(f.length?f.map(pcard):[E("p",t("none"))]));
$("#glist").replaceChildren(...PROJECTS.filter(p=>p.cat==="games").map(pcard));
$("#llist").replaceChildren(...PROJECTS.filter(p=>p.cat==="research"||p.st==="prototype").map(pcard));
$("#road").replaceChildren(...t("road").map(x=>E("li",x)));
route(false)}
function route(go=true){
let h=location.hash.slice(1)||"home";const ok=PAGES.includes(h);const id=ok?h:"404";
$$(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+id));
$$("#nav a").forEach(a=>a.dataset.p===h?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
document.title=(ok?t("nav_"+h):"404")+" — AUREVANT";
$("#nav").classList.remove("open");$("#burger").setAttribute("aria-expanded","false");if(go)window.scrollTo(0,0)}
$("#lang").onclick=()=>{lang=lang==="pt"?"en":"pt";try{localStorage.setItem("av-lang",lang)}catch(e){}render()};
$("#burger").onclick=()=>{const o=$("#nav").classList.toggle("open");$("#burger").setAttribute("aria-expanded",o)};
$("#dclose").onclick=()=>$("#dlg").close();
addEventListener("hashchange",()=>route());
addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#nav").classList.contains("open")){$("#nav").classList.remove("open");$("#burger").setAttribute("aria-expanded","false");$("#burger").focus()}});
$("#dlg").addEventListener("click",e=>{if(e.target===$("#dlg"))$("#dlg").close()});
$("#cf").addEventListener("submit",e=>{e.preventDefault();
const v=[1,2,3,4].map(i=>$("#f"+i).value.trim());let bad=0;
v.forEach((x,i)=>{let m="";if(!x)m=t("e_req");else if(i===1&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x))m=t("e_mail");else if(i===3&&x.length<10)m=t("e_min");
$("#e"+(i+1)).textContent=m;const fld=$("#f"+(i+1));fld.setAttribute("aria-invalid",!!m);fld.setAttribute("aria-describedby","e"+(i+1));if(m){if(!bad)fld.focus();bad++}});
const s=$("#fs");
if(bad){s.className="";return}
s.className="show";
if(CONFIG.email){s.textContent=t("s_mail");location.href="mailto:"+CONFIG.email+"?subject="+encodeURIComponent(v[2])+"&body="+encodeURIComponent(v[3]+"\n\n"+v[0]+" <"+v[1]+">")}
else s.textContent=t("s_ok")});
render();
